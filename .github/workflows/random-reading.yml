name: random-reading

# Random reading for past run-days: fill days the daily run skipped, or top
# days up after an allocation change. Every day that gets anything new is a
# NEW file in the random stream (its header names the run it tops up).
# Start with dry_run to see which journals and how many papers it would cost.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back from yesterday (ignored if from/to are set)"
        required: false
        type: string
        default: "7"
      from_date:
        description: "Range start YYYY-MM-DD (use with to_date)"
        required: false
        type: string
      to_date:
        description: "Range end YYYY-MM-DD (use with from_date)"
        required: false
        type: string
      top_up:
        description: "Keep what a day has and draw only the shortfall"
        type: boolean
        default: false
      dry_run:
        description: "Pick and report, score nothing, write nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Draw and score
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          SCORER_PROMPT_FILE: scorer_v4.txt
          RANGE_FROM: ${{ inputs.from_date }}
          RANGE_TO: ${{ inputs.to_date }}
          DAYS: ${{ inputs.days }}
        run: |
          if [ -n "$RANGE_FROM" ] && [ -n "$RANGE_TO" ]; then
            args="--from $RANGE_FROM --to $RANGE_TO"
          else
            args="--days ${DAYS:-7}"
          fi
          radar random-reading $args \
            ${{ inputs.top_up && '--top-up' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the new random-reading files
        id: commit
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add data/random_reading 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "random reading: past run-days"
          bash scripts/git_push_retry.sh main 5
          echo "committed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [run]
    if: ${{ !cancelled() && needs.run.outputs.committed == 'true' }}
    uses: ./.github/workflows/pages-build.yml
    permissions:
      contents: read
      pages: write
      id-token: write
