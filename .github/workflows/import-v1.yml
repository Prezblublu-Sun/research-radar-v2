name: import-v1

# One-off: bring the v1 radar's High/Medium papers, the reader's picks and
# the visual registry into the append-only streams. Dispatch with dry_run
# first and read the summary; then run for real once. Delete this workflow
# after the import has landed.

on:
  workflow_dispatch:
    inputs:
      old_repo:
        description: "The v1 repository (owner/name, public)"
        required: true
        type: string
        default: "Prezblublu-Sun/research-radar"
      dry_run:
        description: "Count and report only; write and commit nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Sparse-clone the v1 data (no history, no site)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${{ inputs.old_repo }}.git" old-radar
          git -C old-radar sparse-checkout set data/daily data/visuals
          du -sh old-radar/data

      - name: Import
        run: radar import-v1 old-radar ${{ inputs.dry_run && '--dry-run' || '' }} | tee "$RUNNER_TEMP/import.log"

      - name: Summarise
        if: always()
        run: |
          { echo '### v1 import'; echo; echo '```'; cat "$RUNNER_TEMP/import.log" 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the import
        id: commit
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add data/runs/import-v1 data/visuals/import-v1 data/aliases data/eval 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "import: v1 High/Medium papers, picks and visuals"
          bash scripts/git_push_retry.sh main 5
          echo "committed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [run]
    if: ${{ !cancelled() && needs.run.outputs.committed == 'true' }}
    uses: ./.github/workflows/pages-build.yml
    permissions:
      contents: read
      pages: write
      id-token: write
