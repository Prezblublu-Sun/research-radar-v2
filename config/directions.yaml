      - "short stem"
      - "neck-sparing"
      - "hip implant"
      - "total hip arthroplasty"
      - "stress shielding"
      - "micromotion"
      - "primary stability"
      - "osseointegration"
      - "bone remodelling"
      - "bone remodeling"
      - "mechanoregulation"
      - "Dorr"
      - "Gruen zone"
      - "bone-implant interface"
      - "patient-specific finite element"
      - "subject-specific finite element"
      - "porous femoral stem"
      - "porous titanium"
      - "functionally graded scaffold"
      - "bone scaffold"
      - "TPMS"
      - "gyroid"
      - "gradient porosity"
      - "auxetic"
      - "lattice implant"
      - "Ti-6Al-4V"
      - "laser powder bed fusion"
      - "selective laser melting"
      - "virtual trial"
      - "in silico clinical trial"
    must_pair_with:
      - ["finite element", "femoral"]
      - ["finite element", "hip implant"]
      - ["stress shielding", "stem"]
      - ["micromotion", "stem"]
      - ["remodelling", "implant"]
      - ["remodeling", "implant"]
      - ["TPMS", "implant"]
      - ["lattice", "bone"]
      - ["porous", "implant"]
      - ["LPBF", "implant"]
      - ["fatigue", "implant"]
      - ["osseointegration", "porous"]
      - ["surrogate", "bone"]
      - ["surrogate", "implant"]
    tag_namespace: "STEM"
    subtopics:
      Stem: ["femoral stem", "short stem", "collar", "taper", "offset", "neck"]
      Fixation: ["primary stability", "micromotion", "press-fit", "cemented", "cementless"]
      Bone: ["stress shielding", "remodelling", "Dorr", "bone quality", "Gruen", "CT-based"]
      Porous: ["TPMS", "gyroid", "gradient", "lattice", "auxetic", "scaffold"]
      Manufacturing: ["LPBF", "SLM", "Ti-6Al-4V", "fatigue", "surface"]
      Evidence: ["in vitro", "in vivo", "cadaver", "virtual trial", "clinical"]
    llm_prompt_focus: |
      For each paper, evaluate:
      1. Which outcome does it measure — stress shielding, micromotion / primary stability, bone remodelling over time, fatigue — and against what loading (gait, ASTM, activities of daily living)?
      2. Is the bone model patient-specific with heterogeneous properties, or a generic Sawbones / homogeneous femur?
      3. If the implant is porous or lattice-based, is the structure parametrised (TPMS type, porosity gradient) and is manufacturing addressed?
