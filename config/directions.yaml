  #    porous/TPMS/fatigue cluster. Short stem × Dorr type, stress shielding and
  #    remodelling, patient-specific CT models, TPMS/gyroid Ti scaffolds with
  #    fatigue and in vivo data, virtual trials.
  # ───────────────────────────────────────────────────────────────────────────
