# ─────────────────────────────────────────────────────────────────────────────
# Crossover boost — the thesis lives in the intersection.
#
# v1 hard-coded one rule (rl_world_model × fea_surrogate, ADR-0021). For v2 make
# it configuration: a paper routed into the domain anchor AND any method group
# is exactly the kind the keyword filter under-finds (only ~5 of 121 picks sat
# on both sides), so it gets one priority bump. Implement in
# direction_router.apply_crossover_boost by reading this list.
# ─────────────────────────────────────────────────────────────────────────────
crossover_boost:
  - pair: ["stem_biomech", "geo_operator"]
    reason: "operator-learning surrogate applied to an implant / bone geometry"
  - pair: ["stem_biomech", "fe_physics_informed"]
    reason: "physics-informed surrogate for implant mechanics"
  - pair: ["stem_biomech", "surrogate_uq"]
    reason: "uncertainty-aware implant biomechanics"
  - pair: ["stem_biomech", "data_efficient"]
    reason: "few-sample surrogate for patient-specific implant FE"
  - pair: ["stem_biomech", "design_loop"]
    reason: "closed-loop implant design on a simulator"

exclusions:
  hard_exclude_if_only_about:
    - "dental caries"
    - "orthodontic"
    - "spinal cord injury"
    - "drug delivery"
    - "cell culture"
    - "gene expression"
    - "immunology"
    - "pharmacokinetic"
    - "wound healing"
    - "cardiac arrhythmia"
  ambiguous_terms_require_pairing:
    - "stem"          # stem cell vs femoral stem
    - "implant"       # dental / cochlear / breast
    - "operator"      # medical operator / telecom
    - "lattice"       # crystal lattice
    - "remodeling"    # tissue / vascular / cardiac
