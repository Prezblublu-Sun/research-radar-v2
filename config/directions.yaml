        - "C3019025420"  # Total hip arthroplasty
        - "C2778985418"  # Stress shielding
        - "C101414908"   # Osseointegration
        - "C170033053"   # Bone remodeling
        - "C170700871"   # Biomechanics
        - "C26796778"    # Selective laser melting
        - "C2781411149"  # Implant
      openalex_keywords: ["femoral stem finite element", "short stem primary stability", "stress shielding remodeling", "TPMS implant", "porous titanium implant fatigue"]
      pubmed_terms: ["femoral stem finite element", "short stem hip arthroplasty biomechanics", "stress shielding femoral", "porous titanium implant osseointegration", "patient-specific finite element hip"]
    strong_keywords:
